<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lời Nhắn Rơi Chuyển Hóa Thành Lơ Lửng Vĩnh Viễn</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #000000;
            margin: 0;
            overflow: hidden; 
            display: flex; 
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        
        /* CHỮ TỔNG QUÁT: Nhỏ, Hồng Nhạt, Chỉ Phát Sáng (Không nhấp nháy 7 màu) */
        .message {
            position: absolute;
            font-size: 0.9em; 
            font-weight: bold;
            white-space: nowrap;
            opacity: 1; 
            z-index: 10; 
            color: #FFC0CB; /* Màu hồng nhạt */
            /* Phát sáng hồng nhạt đơn giản */
            text-shadow: 0 0 10px #FFC0CB, 0 0 20px rgba(255, 192, 203, 0.5); 
        }
        
        /* Chữ RƠI (Chậm, 10s) */
        .message.fall {
             opacity: 0; /* Khởi đầu ẩn cho chữ rơi */
             animation: fallAndFade 10s forwards; 
             -webkit-animation: fallAndFade 10s forwards;
        }

        /* Chữ LƠ LỬNG (Vĩnh viễn & NHANH HƠN: 3s) */
        .message.floating {
            opacity: 1; /* Hiện ngay lập tức */
            animation: hoverBubble 3s infinite alternate ease-in-out; 
            -webkit-animation: hoverBubble 3s infinite alternate ease-in-out;
        }

        /* Keyframes RƠI XUỐNG ĐÍT */
        @keyframes fallAndFade {
            0% { opacity: 0; transform: translateY(-50px) scale(1); }
            5% { opacity: 0.9; }
            99% { opacity: 0.9; transform: translateY(100vh) scale(1); } 
            100% { opacity: 0; transform: translateY(100vh) scale(0); } /* Bị JS CAN THIỆP TRƯỚC LÚC NÀY */
        }
        @-webkit-keyframes fallAndFade {
            0% { opacity: 0; -webkit-transform: translateY(-50px) scale(1); }
            5% { opacity: 0.9; }
            99% { opacity: 0.9; -webkit-transform: translateY(100vh) scale(1); }
            100% { opacity: 0; -webkit-transform: translateY(100vh) scale(0); }
        }
        
        /* Keyframes BONG BÓNG LẮC LƯ NHANH (3s) */
        @keyframes hoverBubble {
            from { transform: translateY(0px) rotate(1deg); }
            to { transform: translateY(-30px) rotate(-1deg); } 
        }
        @-webkit-keyframes hoverBubble {
            from { -webkit-transform: translateY(0px) rotate(1deg); }
            to { -webkit-transform: translateY(-30px) rotate(-1deg); }
        }
        
        /* Icon 🖕🏻: Giữ nguyên màu gốc và chỉ phát sáng đơn giản */
        .message.icon {
            color: inherit; 
            text-shadow: 0 0 10px rgba(255, 255, 0, 0.8), 0 0 20px rgba(255, 165, 0, 0.5); 
        }
        
        /* Icon Rơi */
        .message.icon.fall {
            opacity: 0;
            animation: fallAndFade 10s forwards, pulseIcon 1s infinite alternate; 
            -webkit-animation: fallAndFade 10s forwards, pulseIcon 1s infinite alternate;
        }

        /* Icon Lơ Lửng (NHANH HƠN) */
        .message.icon.floating {
            animation: hoverBubble 3s infinite alternate ease-in-out, pulseIcon 1s infinite alternate; 
            -webkit-animation: hoverBubble 3s infinite alternate ease-in-out, pulseIcon 1s infinite alternate;
        }

        @keyframes pulseIcon {
             from { text-shadow: 0 0 5px rgba(255, 255, 0, 0.6); }
             to { text-shadow: 0 0 15px rgba(255, 255, 0, 1), 0 0 25px rgba(255, 165, 0, 0.8); }
        }
        
        #sticker-container {
            position: relative; z-index: 5; text-align: center; 
        }

        #main-sticker {
            width: 250px; 
            height: auto; border-radius: 15px; 
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.7); 
            animation: pulseSticker 2s infinite alternate; 
        }

        @keyframes pulseSticker {
            from { transform: scale(1); box-shadow: 0 0 15px rgba(255, 0, 85, 0.5); }
            to { transform: scale(1.05); box-shadow: 0 0 30px rgba(255, 0, 85, 0.9); }
        }
    </style>
</head>
<body>
    
    <div id="sticker-container">
        <img id="main-sticker" src="https://media2.giphy.com/media/v1.Y2lkPTZjMDliOTUyNjltb2trYnlmMnoybmEzeG40d2c2OTd0d2V6YTFsM21paXRmbTBuOSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/GuAyo258Gj8m7UXYLg/giphy.gif" alt="Sticker chó đẻ">
    </div>

    <script>
        // Danh sách chữ RƠI (CHỈ CÓ CẢM ƠN VÀ 🖕🏻)
        const messages = [
            "địt mẹ cảm ơn nha", 
            "🖕🏻"
        ];

        const STICKER_WIDTH = 250; 
        const STICKER_HEIGHT = 350; 

        // Hàm NÉ KHUNG VẪN GIỮ NGUYÊN NHƯ VỊ TRÍ CUỐI CÙNG CỦA CHỮ LƠ LỬNG
        function getRandomPosition(element, viewportWidth, viewportHeight) {
            const elementWidth = element.offsetWidth;
            const elementHeight = element.offsetHeight;
            
            const centerX = viewportWidth / 2;
            const centerY = viewportHeight / 2;
            
            const banRadiusX = STICKER_WIDTH / 2 + 20; 
            const banRadiusY = STICKER_HEIGHT / 2 + 20;
            
            let x, y;
            let tries = 0;
            
            do {
                x = Math.random() * (viewportWidth - elementWidth);
                y = Math.random() * (viewportHeight - elementHeight);
                
                const distanceX = Math.abs(x + elementWidth / 2 - centerX);
                const distanceY = Math.abs(y + elementHeight / 2 - centerY);
                
                if (distanceX > banRadiusX || distanceY > banRadiusY || tries > 100) {
                    break; 
                }
                tries++;
                
            } while (true);

            return { x, y };
        }
        
        // HÀM TẠO CHỮ (TẤT CẢ ĐỀU LÀ CHỮ RƠI)
        function createMessage() {
            
            const text = messages[Math.floor(Math.random() * messages.length)];

            const messageElement = document.createElement('div');
            messageElement.classList.add('message');
            messageElement.textContent = text;
            
            if (text.includes('🖕🏻')) {
                messageElement.classList.add('icon');
            }
            
            document.body.appendChild(messageElement);
            
            // Bắt đầu là LOGIC CHỮ RƠI
            messageElement.classList.add('fall');
            
            const startX = Math.random() * (window.innerWidth - 150); 
            messageElement.style.left = startX + 'px';
            messageElement.style.top = '-50px'; 
            
            const delay = Math.random() * 0.5; 
            messageElement.style.animationDelay = delay + 's';

            // CHUYỂN TỪ RƠI SANG LƠ LỬNG KHI CHẠM ĐÁY (ĐÉO BIẾN MẤT)
            const animationDuration = 10000; // 10s
            const totalTime = animationDuration + (delay * 1000); 
            
            setTimeout(() => {
                // 1. Tắt animation (dừng chuyển động rơi)
                messageElement.style.animation = 'none';
                messageElement.style.webkitAnimation = 'none';

                // 2. Set vị trí cố định (Đáy màn hình - chiều cao chữ)
                const finalTop = window.innerHeight - messageElement.offsetHeight; 
                
                // TÍNH TOÁN LẠI VỊ TRÍ X ĐỂ NÉ KHUNG TRƯỚC KHI LƠ LỬNG
                const viewportWidth = window.innerWidth;
                const currentPos = messageElement.getBoundingClientRect();
                let newX = currentPos.left;
                
                const centerX = viewportWidth / 2;
                const banRadiusX = STICKER_WIDTH / 2 + 20;
                
                // NẾU VỊ TRÍ X CUỐI CÙNG NẰM TRONG VÙNG CẤM (THEO CHIỀU NGANG)
                if (Math.abs(currentPos.left + messageElement.offsetWidth / 2 - centerX) < banRadiusX) {
                    // Đẩy nó sang trái hoặc phải của khung
                    if (currentPos.left < centerX) {
                        newX = centerX - banRadiusX - messageElement.offsetWidth; // Đẩy sang trái
                    } else {
                        newX = centerX + banRadiusX; // Đẩy sang phải
                    }
                    // Giữ cho nó trong màn hình
                    newX = Math.min(Math.max(0, newX), viewportWidth - messageElement.offsetWidth);
                }
                
                messageElement.style.left = newX + 'px';
                messageElement.style.top = finalTop + 'px'; 
                
                // 3. Chuyển sang Lơ Lửng
                messageElement.classList.remove('fall');
                messageElement.classList.add('floating');
                
                // Bắt đầu animation lơ lửng
                messageElement.style.animationDelay = (Math.random() * 4) + 's';

            }, totalTime - 50); // CHẠY TRƯỚC 50ms ĐỂ TRÁNH BIẾN MẤT
            
            return messageElement;
        }

        function startFallingMessages() {
            // TẠO CHỮ RƠI MỖI 250ms (Chữ RƠI là nguồn duy nhất)
            setInterval(createMessage, 250); 
        }

        // CHỈ CÓ CHỮ RƠI (VÀ SAU ĐÓ LÀ LƠ LỬNG) ĐƯỢC GỌI
        window.onload = startFallingMessages;

    </script>
</body>
</html>
