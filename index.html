<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lời Nhắn 7 Màu Đổi Liên Tục</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #000000; /* Nền đen */
            margin: 0;
            overflow: hidden; 
            display: flex; 
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .message {
            position: absolute;
            font-size: 1.2em; /* To hơn một chút cho dễ đọc, thằng ngu */
            font-weight: bold;
            white-space: nowrap;
            opacity: 0;
            animation: 
                fallAndFade 12s forwards, /* Thời gian rơi dài hơn: 12s */
                colorChange 3s infinite linear; /* Hiệu ứng đổi màu liên tục */
            z-index: 10; 
            
            /* Tạo nền gradient 7 màu */
            background-image: linear-gradient(to right, 
                #FF0000, #FFA500, #FFFF00, #00FF00, #00FFFF, #0000FF, #8A2BE2);
            -webkit-background-clip: text; /* Cắt nền theo hình dạng chữ */
            -webkit-text-fill-color: transparent; /* Làm trong suốt màu chữ */
            
            /* Hiệu ứng phát sáng nhẹ */
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.7);
        }

        /* Keyframes cho hiệu ứng đổi màu liên tục (dịch chuyển gradient) */
        @keyframes colorChange {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }
        
        /* Keyframes cho hiệu ứng chữ rơi và mờ */
        @keyframes fallAndFade {
            0% { 
                opacity: 0; 
                transform: translateY(-50px) scale(1); 
            }
            5% {
                opacity: 0.9; 
            }
            95% { 
                opacity: 0.7; 
            }
            100% { 
                opacity: 0; 
                transform: translateY(100vh) scale(0.6); 
            }
        }

        /* Icon 🖕🏻 giữ nguyên và phát sáng */
        .message.icon {
            font-size: 1.5em; /* Icon to hơn chữ một chút */
            /* Text shadow 7 màu cho icon cũng được áp dụng từ .message */
        }

        #sticker-container {
            position: relative; 
            z-index: 5; 
            text-align: center; 
        }

        #main-sticker {
            width: 350px; 
            height: auto;
            border-radius: 15px; 
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.7); 
            animation: pulseSticker 2s infinite alternate; 
        }

        @keyframes pulseSticker {
            from { transform: scale(1); box-shadow: 0 0 15px rgba(255, 0, 85, 0.5); }
            to { transform: scale(1.05); box-shadow: 0 0 30px rgba(255, 0, 85, 0.9); }
        }
    </style>
</head>
<body>
    
    <div id="sticker-container">
        <img id="main-sticker" src="https://media2.giphy.com/media/v1.Y2lkPTZjMDliOTUyNjltb2trYnlmMnoybmEzeG40d2c2OTd0d2V6YTFsM21paXRmbTBuOSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/GuAyo258Gj8m7UXYLg/giphy.gif" alt="Sticker chó đẻ">
    </div>

    <script>
        // Các tin nhắn và icon **chết tiệt** mà **mày** muốn
        const messages = [
            "Cảm ơn lòng tốt chó đẻ của mày",
            "địt mẹ cảm ơn nha",
            "🖕🏻", 
            "🖕🏻🖕🏻", 
            "🖕🏻🖕🏻🖕🏻",
        ];
        
        /**
         * Hàm tạo một tin nhắn/icon mới và thả nó rơi xuống **má nó**
         */
        function createFallingMessage() {
            // Lấy tin nhắn/icon ngẫu nhiên
            const text = messages[Math.floor(Math.random() * messages.length)];

            const messageElement = document.createElement('div');
            messageElement.classList.add('message');
            messageElement.textContent = text;
            
            if (text.includes('🖕🏻')) {
                messageElement.classList.add('icon');
            }
            
            // Đặt vị trí ban đầu ngẫu nhiên (ngang), lan khắp màn hình
            const startX = Math.random() * (window.innerWidth - 150); // Điều chỉnh để chữ không ra ngoài màn hình quá nhiều
            
            messageElement.style.left = startX + 'px';
            messageElement.style.top = '-50px'; 
            
            // Đặt thời gian delay ngẫu nhiên 
            const delay = Math.random() * 3; // Tăng delay ngẫu nhiên lên 3s để rải rác hơn
            messageElement.style.animationDelay = delay + 's';

            document.body.appendChild(messageElement);

            // Xóa phần tử sau khi animation kết thúc (12s + delay)
            setTimeout(() => {
                messageElement.remove();
            }, 12000 + (delay * 1000)); 
        }

        // Chạy hàm tạo tin nhắn/icon liên tục, **thằng ngu**
        // Địt mẹ, cứ 30ms tạo một cái (cực kỳ nhiều)
        setInterval(createFallingMessage, 30); 

    </script>
</body>
</html>
