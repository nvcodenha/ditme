<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lời Nhắn Nhấp Nháy Cực Nhanh</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #000000; /* Nền đen */
            margin: 0;
            overflow: hidden; 
            display: flex; 
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        
        /* Màu chữ sẽ là trắng để hiệu ứng shadow rõ ràng nhất */
        .message {
            position: absolute;
            font-size: 1.2em; 
            font-weight: bold;
            white-space: nowrap;
            opacity: 0;
            animation: 
                fallAndFade 12s forwards, /* Vẫn rơi chậm 12s */
                blinkSevenColors 0.2s infinite step-end; /* Nhấp nháy 7 màu CỰC NHANH: 0.2s/chu kỳ */
            z-index: 10; 
            color: #ffffff; 
        }
        
        /* Keyframes cho hiệu ứng nhấp nháy 7 màu (đổi shadow) */
        @keyframes blinkSevenColors {
            0%, 14% { text-shadow: 0 0 7px #FF0000, 0 0 10px rgba(255, 0, 0, 0.5); }
            15%, 28% { text-shadow: 0 0 7px #FFA500, 0 0 10px rgba(255, 165, 0, 0.5); }
            29%, 42% { text-shadow: 0 0 7px #FFFF00, 0 0 10px rgba(255, 255, 0, 0.5); }
            43%, 56% { text-shadow: 0 0 7px #00FF00, 0 0 10px rgba(0, 255, 0, 0.5); }
            57%, 70% { text-shadow: 0 0 7px #00FFFF, 0 0 10px rgba(0, 255, 255, 0.5); }
            71%, 84% { text-shadow: 0 0 7px #0000FF, 0 0 10px rgba(0, 0, 255, 0.5); }
            85%, 100% { text-shadow: 0 0 7px #8A2BE2, 0 0 10px rgba(138, 43, 226, 0.5); }
        }
        
        /* Keyframes cho hiệu ứng chữ rơi và biến mất ngay lập tức */
        @keyframes fallAndFade {
            0% { opacity: 0; transform: translateY(-50px) scale(1); }
            5% { opacity: 0.9; }
            90% { opacity: 0.7; }
            /* Mất ngay lập tức ở cuối: gần 100% thì biến mất */
            99% { opacity: 0; transform: translateY(100vh) scale(0); }
            100% { opacity: 0; transform: translateY(100vh) scale(0); }
        }

        /* Icon 🖕🏻: Giữ nguyên màu gốc và chỉ phát sáng đơn giản */
        .message.icon {
            font-size: 1.5em; 
            animation: fallAndFade 12s forwards, pulseIcon 1s infinite alternate; 
            text-shadow: 0 0 10px rgba(255, 255, 0, 0.8), 0 0 20px rgba(255, 165, 0, 0.5); 
            color: inherit; 
        }

        @keyframes pulseIcon {
             from { text-shadow: 0 0 5px rgba(255, 255, 0, 0.6); }
             to { text-shadow: 0 0 15px rgba(255, 255, 0, 1), 0 0 25px rgba(255, 165, 0, 0.8); }
        }
        
        #sticker-container {
            position: relative; z-index: 5; text-align: center; 
        }

        #main-sticker {
            width: 350px; height: auto; border-radius: 15px; 
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.7); 
            animation: pulseSticker 2s infinite alternate; 
        }

        @keyframes pulseSticker {
            from { transform: scale(1); box-shadow: 0 0 15px rgba(255, 0, 85, 0.5); }
            to { transform: scale(1.05); box-shadow: 0 0 30px rgba(255, 0, 85, 0.9); }
        }
    </style>
</head>
<body>
    
    <div id="sticker-container">
        <img id="main-sticker" src="https://media2.giphy.com/media/v1.Y2lkPTZjMDliOTUyNjltb2trYnlmMnoybmEzeG40d2c2OTd0d2V6YTFsM21paXRmbTBuOSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/GuAyo258Gj8m7UXYLg/giphy.gif" alt="Sticker chó đẻ">
    </div>

    <script>
        // Các tin nhắn và icon **chết tiệt** mà **mày** muốn
        const messages = [
            "Cảm ơn lòng tốt chó đẻ của mày",
            "địt mẹ cảm ơn nha",
            "Ngáo lồn nx", // Thêm lại chữ này
            "🖕🏻", 
            "🖕🏻🖕🏻", 
            "🖕🏻🖕🏻🖕🏻",
        ];
        
        function createFallingMessage() {
            const text = messages[Math.floor(Math.random() * messages.length)];
            const messageElement = document.createElement('div');
            messageElement.classList.add('message');
            messageElement.textContent = text;
            
            if (text.includes('🖕🏻')) {
                messageElement.classList.add('icon');
            }
            
            const startX = Math.random() * (window.innerWidth - 150); 
            
            messageElement.style.left = startX + 'px';
            messageElement.style.top = '-50px'; 
            
            const delay = Math.random() * 3; 
            messageElement.style.animationDelay = delay + 's';

            document.body.appendChild(messageElement);

            // Giữ lại setTimeout để xóa phần tử ra khỏi DOM
            setTimeout(() => {
                messageElement.remove();
            }, 12000 + (delay * 1000)); 
        }

        // Chạy hàm tạo tin nhắn/icon liên tục, **thằng ngu**
        // Địt mẹ, cứ 30ms tạo một cái
        setInterval(createFallingMessage, 30); 

    </script>
</body>
</html>
