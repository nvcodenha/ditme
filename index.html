<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lời Nhắn Lơ Lửng & Rơi Hồng Nhạt</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #000000;
            margin: 0;
            overflow: hidden; 
            display: flex; 
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        
        /* Chỉnh chữ NHỎ LẠI và màu HỒNG NHẠT */
        .message {
            position: absolute;
            font-size: 0.9em; 
            font-weight: bold;
            white-space: nowrap;
            opacity: 1; 
            z-index: 10; 
            color: #FFC0CB; /* Màu hồng nhạt */
        }
        
        /* Chữ RƠI (Chậm, 10s) */
        .message.fall {
             opacity: 0; /* Khởi đầu ẩn cho chữ rơi */
             animation: 
                fallAndFade 10s forwards, 
                blinkSevenColors 0.15s infinite step-end; 
            -webkit-animation: 
                fallAndFade 10s forwards, 
                blinkSevenColors 0.15s infinite step-end;
        }

        /* Chữ LƠ LỬNG (Vĩnh viễn & NHANH HƠN: 3s) */
        .message.floating {
            opacity: 1; /* Hiện ngay lập tức */
            animation: 
                hoverBubble 3s infinite alternate ease-in-out, /* NHANH HƠN */
                blinkSevenColors 0.15s infinite step-end; 
            -webkit-animation: 
                hoverBubble 3s infinite alternate ease-in-out, 
                blinkSevenColors 0.15s infinite step-end;
        }

        /* Keyframes RƠI XUỐNG ĐÍT VÀ BIẾN MẤT TẠI CHỖ */
        @keyframes fallAndFade {
            0% { opacity: 0; transform: translateY(-50px) scale(1); }
            5% { opacity: 0.9; }
            99% { opacity: 0.9; transform: translateY(100vh) scale(1); } 
            100% { opacity: 0; transform: translateY(100vh) scale(0); } /* Biến mất NGAY TẠI ĐÂY */
        }
        @-webkit-keyframes fallAndFade {
            0% { opacity: 0; -webkit-transform: translateY(-50px) scale(1); }
            5% { opacity: 0.9; }
            99% { opacity: 0.9; -webkit-transform: translateY(100vh) scale(1); }
            100% { opacity: 0; -webkit-transform: translateY(100vh) scale(0); }
        }
        
        /* Keyframes BONG BÓNG LẮC LƯ NHANH */
        @keyframes hoverBubble {
            from { transform: translateY(0px) rotate(1deg); }
            to { transform: translateY(-30px) rotate(-1deg); } 
        }
        @-webkit-keyframes hoverBubble {
            from { -webkit-transform: translateY(0px) rotate(1deg); }
            to { -webkit-transform: translateY(-30px) rotate(-1deg); }
        }
        
        /* Keyframes ĐỔI MÀU CỰC NHANH (0.15s) */
        @keyframes blinkSevenColors {
            0%, 14% { text-shadow: 0 0 7px #FF0000, 0 0 10px rgba(255, 0, 0, 0.5); }
            15%, 28% { text-shadow: 0 0 7px #FFA500, 0 0 10px rgba(255, 165, 0, 0.5); }
            29%, 42% { text-shadow: 0 0 7px #FFFF00, 0 0 10px rgba(255, 255, 0, 0.5); }
            43%, 56% { text-shadow: 0 0 7px #00FF00, 0 0 10px rgba(0, 255, 0, 0.5); }
            57%, 70% { text-shadow: 0 0 7px #00FFFF, 0 0 10px rgba(0, 255, 255, 0.5); }
            71%, 84% { text-shadow: 0 0 7px #0000FF, 0 0 10px rgba(0, 0, 255, 0.5); }
            85%, 100% { text-shadow: 0 0 7px #8A2BE2, 0 0 10px rgba(138, 43, 226, 0.5); }
        }
        @-webkit-keyframes blinkSevenColors {
            0%, 14% { text-shadow: 0 0 7px #FF0000, 0 0 10px rgba(255, 0, 0, 0.5); }
            15%, 28% { text-shadow: 0 0 7px #FFA500, 0 0 10px rgba(255, 165, 0, 0.5); }
            29%, 42% { text-shadow: 0 0 7px #FFFF00, 0 0 10px rgba(255, 255, 0, 0.5); }
            43%, 56% { text-shadow: 0 0 7px #00FF00, 0 0 10px rgba(0, 255, 0, 0.5); }
            57%, 70% { text-shadow: 0 0 7px #00FFFF, 0 0 10px rgba(0, 255, 255, 0.5); }
            71%, 84% { text-shadow: 0 0 7px #0000FF, 0 0 10px rgba(0, 0, 255, 0.5); }
            85%, 100% { text-shadow: 0 0 7px #8A2BE2, 0 0 10px rgba(138, 43, 226, 0.5); }
        }
        
        /* Icon 🖕🏻: Giữ nguyên màu gốc và chỉ phát sáng đơn giản */
        .message.icon {
            text-shadow: 0 0 10px rgba(255, 255, 0, 0.8), 0 0 20px rgba(255, 165, 0, 0.5); 
            color: inherit; 
        }
        /* Icon Lơ Lửng (NHANH HƠN) */
        .message.icon.floating {
            animation: 
                hoverBubble 3s infinite alternate ease-in-out, 
                pulseIcon 1s infinite alternate; 
            -webkit-animation: 
                hoverBubble 3s infinite alternate ease-in-out, 
                pulseIcon 1s infinite alternate;
        }
        /* Icon Rơi */
        .message.icon.fall {
            opacity: 0;
            animation: 
                fallAndFade 10s forwards, 
                pulseIcon 1s infinite alternate;
            -webkit-animation: 
                fallAndFade 10s forwards, 
                pulseIcon 1s infinite alternate;
        }

        @keyframes pulseIcon {
             from { text-shadow: 0 0 5px rgba(255, 255, 0, 0.6); }
             to { text-shadow: 0 0 15px rgba(255, 255, 0, 1), 0 0 25px rgba(255, 165, 0, 0.8); }
        }
        
        #sticker-container {
            position: relative; z-index: 5; text-align: center; 
        }

        #main-sticker {
            width: 250px; 
            height: auto; border-radius: 15px; 
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.7); 
            animation: pulseSticker 2s infinite alternate; 
        }

        @keyframes pulseSticker {
            from { transform: scale(1); box-shadow: 0 0 15px rgba(255, 0, 85, 0.5); }
            to { transform: scale(1.05); box-shadow: 0 0 30px rgba(255, 0, 85, 0.9); }
        }
    </style>
</head>
<body>
    
    <div id="sticker-container">
        <img id="main-sticker" src="https://media2.giphy.com/media/v1.Y2lkPTZjMDliOTUyNjltb2trYnlmMnoybmEzeG40d2c2OTd0d2V6YTFsM21paXRmbTBuOSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/GuAyo258Gj8m7UXYLg/giphy.gif" alt="Sticker chó đẻ">
    </div>

    <script>
        const messages = [
            "Cảm ơn lòng tốt chó đẻ của mày",
            "địt mẹ cảm ơn nha",
            "🖕🏻", 
            "🖕🏻🖕🏻", 
            "🖕🏻🖕🏻🖕🏻",
        ];

        const STICKER_WIDTH = 250; 
        const STICKER_HEIGHT = 350; 
        const MESSAGE_FLOATING_COUNT = 15; // 15 chữ lơ lửng xếp sẵn

        function getRandomPosition(element, viewportWidth, viewportHeight) {
            const elementWidth = element.offsetWidth;
            const elementHeight = element.offsetHeight;
            
            const centerX = viewportWidth / 2;
            const centerY = viewportHeight / 2;
            
            // Khu vực cấm (quanh sticker)
            const banRadiusX = STICKER_WIDTH / 2 + 20; 
            const banRadiusY = STICKER_HEIGHT / 2 + 20;
            
            let x, y;
            let tries = 0;
            
            do {
                x = Math.random() * (viewportWidth - elementWidth);
                y = Math.random() * (viewportHeight - elementHeight);
                
                const distanceX = Math.abs(x + elementWidth / 2 - centerX);
                const distanceY = Math.abs(y + elementHeight / 2 - centerY);
                
                if (distanceX > banRadiusX || distanceY > banRadiusY || tries > 100) {
                    break; 
                }
                tries++;
                
            } while (true);

            return { x, y };
        }
        
        function createMessage(isFloating = true) {
            const text = messages[Math.floor(Math.random() * messages.length)];
            const messageElement = document.createElement('div');
            messageElement.classList.add('message');
            messageElement.textContent = text;
            
            if (text.includes('🖕🏻')) {
                messageElement.classList.add('icon');
            }
            
            document.body.appendChild(messageElement);
            
            if (isFloating) {
                messageElement.classList.add('floating');
                // Vị trí cho chữ lơ lửng (NÉ KHUNG)
                const pos = getRandomPosition(messageElement, window.innerWidth, window.innerHeight);
                messageElement.style.left = pos.x + 'px';
                messageElement.style.top = pos.y + 'px'; 
                
                // Random delay cho chuyển động bong bóng
                messageElement.style.animationDelay = (Math.random() * 4) + 's';
                
            } else {
                messageElement.classList.add('fall');
                // Vị trí cho chữ rơi (Trên cùng)
                const startX = Math.random() * (window.innerWidth - 150); 
                messageElement.style.left = startX + 'px';
                messageElement.style.top = '-50px'; 
                
                // Delay cho animation rơi
                const delay = Math.random() * 0.5; 
                messageElement.style.animationDelay = delay + 's';

                // Chữ rơi biến mất sau 10s + delay
                setTimeout(() => {
                    messageElement.remove();
                }, 10000 + (delay * 1000)); 
            }
            
            return messageElement;
        }

        // 1. TẠO CHỮ LƠ LỬNG SẴN NGAY LẬP TỨC
        function initializeFloatingMessages() {
            for (let i = 0; i < MESSAGE_FLOATING_COUNT; i++) {
                createMessage(true); // Tạo chữ Lơ Lửng
            }
        }
        
        // 2. TẠO CHỮ RƠI ĐỀU ĐẶN SAU KHI WEB LOAD
        function startFallingMessages() {
            // TẠO CHỮ RƠI MỖI 250ms 
            setInterval(() => createMessage(false), 250);
        }


        window.onload = () => {
             initializeFloatingMessages();
             // CHỮ RƠI HIỆN NGAY LẬP TỨC
             startFallingMessages(); 
        };

    </script>
</body>
</html>
