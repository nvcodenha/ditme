<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lời Nhắn Lơ Lửng Toàn Màn Hình & Rơi Nhanh</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #000000;
            margin: 0;
            overflow: hidden; 
            display: flex; 
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        
        .message {
            position: absolute;
            font-size: 1.2em; 
            font-weight: bold;
            white-space: nowrap;
            opacity: 0;
            z-index: 10; 
            color: #ffffff; 
            
            /* Mặc định cho chữ rơi (RƠI NHANH HƠN: 8s) */
            animation: 
                fallAndFade 8s forwards, 
                blinkSevenColors 0.15s infinite step-end; 
            -webkit-animation: 
                fallAndFade 8s forwards, 
                blinkSevenColors 0.15s infinite step-end;
        }

        /* CHỮ LƠ LỬNG - XUẤT HIỆN & BIẾN MẤT */
        .message.floating {
            /* Lơ lửng 6s rồi biến mất (1s xuất hiện + 5s giữ + 1s biến mất) */
            animation: 
                floatingFade 7s forwards, 
                blinkSevenColors 0.15s infinite step-end; 
            -webkit-animation: 
                floatingFade 7s forwards, 
                blinkSevenColors 0.15s infinite step-end;
            top: 50%; /* Vị trí khởi đầu sẽ được JS ghi đè */
            transform: none; /* Bỏ căn giữa để có thể đặt vị trí toàn màn hình */
            opacity: 0;
        }

        /* Keyframes cho chữ LƠ LỬNG (Xuất hiện và Biến mất nhanh) */
        @keyframes floatingFade {
            0% { opacity: 0; transform: scale(0.8); } /* Xuất hiện */
            15% { opacity: 1; transform: scale(1); } /* Giữ */
            85% { opacity: 1; transform: scale(1); } /* Giữ */
            100% { opacity: 0; transform: scale(0.5); } /* Biến mất nhanh */
        }
        @-webkit-keyframes floatingFade {
            0% { opacity: 0; -webkit-transform: scale(0.8); }
            15% { opacity: 1; -webkit-transform: scale(1); }
            85% { opacity: 1; -webkit-transform: scale(1); }
            100% { opacity: 0; -webkit-transform: scale(0.5); }
        }
        
        /* Keyframes RƠI XUỐNG ĐÍT VÀ BIẾN MẤT TẠI CHỖ */
        @keyframes fallAndFade {
            0% { opacity: 0; transform: translateY(-50px) scale(1); }
            5% { opacity: 0.9; }
            99% { opacity: 0.9; transform: translateY(100vh) scale(1); } 
            100% { opacity: 0; transform: translateY(100vh) scale(0); } /* Biến mất NGAY TẠI ĐÂY */
        }
        @-webkit-keyframes fallAndFade {
            0% { opacity: 0; -webkit-transform: translateY(-50px) scale(1); }
            5% { opacity: 0.9; }
            99% { opacity: 0.9; -webkit-transform: translateY(100vh) scale(1); }
            100% { opacity: 0; -webkit-transform: translateY(100vh) scale(0); }
        }

        /* Keyframes ĐỔI MÀU NHANH (0.15s) */
        @keyframes blinkSevenColors {
            0%, 14% { text-shadow: 0 0 7px #FF0000, 0 0 10px rgba(255, 0, 0, 0.5); }
            15%, 28% { text-shadow: 0 0 7px #FFA500, 0 0 10px rgba(255, 165, 0, 0.5); }
            29%, 42% { text-shadow: 0 0 7px #FFFF00, 0 0 10px rgba(255, 255, 0, 0.5); }
            43%, 56% { text-shadow: 0 0 7px #00FF00, 0 0 10px rgba(0, 255, 0, 0.5); }
            57%, 70% { text-shadow: 0 0 7px #00FFFF, 0 0 10px rgba(0, 255, 255, 0.5); }
            71%, 84% { text-shadow: 0 0 7px #0000FF, 0 0 10px rgba(0, 0, 255, 0.5); }
            85%, 100% { text-shadow: 0 0 7px #8A2BE2, 0 0 10px rgba(138, 43, 226, 0.5); }
        }
        @-webkit-keyframes blinkSevenColors {
            0%, 14% { text-shadow: 0 0 7px #FF0000, 0 0 10px rgba(255, 0, 0, 0.5); }
            15%, 28% { text-shadow: 0 0 7px #FFA500, 0 0 10px rgba(255, 165, 0, 0.5); }
            29%, 42% { text-shadow: 0 0 7px #FFFF00, 0 0 10px rgba(255, 255, 0, 0.5); }
            43%, 56% { text-shadow: 0 0 7px #00FF00, 0 0 10px rgba(0, 255, 0, 0.5); }
            57%, 70% { text-shadow: 0 0 7px #00FFFF, 0 0 10px rgba(0, 255, 255, 0.5); }
            71%, 84% { text-shadow: 0 0 7px #0000FF, 0 0 10px rgba(0, 0, 255, 0.5); }
            85%, 100% { text-shadow: 0 0 7px #8A2BE2, 0 0 10px rgba(138, 43, 226, 0.5); }
        }
        
        /* Icon 🖕🏻: Giữ nguyên màu gốc và chỉ phát sáng đơn giản */
        .message.icon {
            text-shadow: 0 0 10px rgba(255, 255, 0, 0.8), 0 0 20px rgba(255, 165, 0, 0.5); 
            color: inherit; 
        }
        .message.icon.floating {
            animation: floatingFade 7s forwards, pulseIcon 1s infinite alternate; 
            -webkit-animation: floatingFade 7s forwards, pulseIcon 1s infinite alternate;
        }

        @keyframes pulseIcon {
             from { text-shadow: 0 0 5px rgba(255, 255, 0, 0.6); }
             to { text-shadow: 0 0 15px rgba(255, 255, 0, 1), 0 0 25px rgba(255, 165, 0, 0.8); }
        }
        
        #sticker-container {
            position: relative; z-index: 5; text-align: center; 
        }

        #main-sticker {
            width: 350px; height: auto; border-radius: 15px; 
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.7); 
            animation: pulseSticker 2s infinite alternate; 
        }

        @keyframes pulseSticker {
            from { transform: scale(1); box-shadow: 0 0 15px rgba(255, 0, 85, 0.5); }
            to { transform: scale(1.05); box-shadow: 0 0 30px rgba(255, 0, 85, 0.9); }
        }
    </style>
</head>
<body>
    
    <div id="sticker-container">
        <img id="main-sticker" src="https://media2.giphy.com/media/v1.Y2lkPTZjMDliOTUyNjltb2trYnlmMnoybmEzeG40d2c2OTd0d2V6YTFsM21paXRmbTBuOSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/GuAyo258Gj8m7UXYLg/giphy.gif" alt="Sticker chó đẻ">
    </div>

    <script>
        const messages = [
            "Cảm ơn lòng tốt chó đẻ của mày",
            "địt mẹ cảm ơn nha",
            "Ngáo lồn nx",
            "🖕🏻", 
            "🖕🏻🖕🏻", 
            "🖕🏻🖕🏻🖕🏻",
        ];
        
        function createMessage() {
            const text = messages[Math.floor(Math.random() * messages.length)];
            const messageElement = document.createElement('div');
            messageElement.classList.add('message');
            messageElement.textContent = text;
            
            // 50% là chữ lơ lửng, 50% là chữ rơi
            const isFloating = Math.random() < 0.5; 

            if (isFloating) {
                messageElement.classList.add('floating');
                // Vị trí NGẪU NHIÊN toàn màn hình cho chữ lơ lửng
                messageElement.style.left = Math.random() * (window.innerWidth - 150) + 'px';
                messageElement.style.top = Math.random() * (window.innerHeight - 100) + 'px';
                
                // Chữ lơ lửng biến mất sau 7s (thời gian animation)
                setTimeout(() => {
                    messageElement.remove();
                }, 7000); 

            } else {
                // Chữ rơi
                const startX = Math.random() * (window.innerWidth - 150); 
                messageElement.style.left = startX + 'px';
                messageElement.style.top = '-50px'; 
                const delay = Math.random() * 0.5; 
                messageElement.style.animationDelay = delay + 's';

                // Chữ rơi biến mất sau 8s (thời gian animation) + delay
                setTimeout(() => {
                    messageElement.remove();
                }, 8000 + (delay * 1000)); 
            }

            if (text.includes('🖕🏻')) {
                messageElement.classList.add('icon');
            }
            
            document.body.appendChild(messageElement);
        }

        // Giảm tần suất tạo chữ tổng thể để không bị dính cục
        setInterval(createMessage, 150); /* Tạo tin nhắn mỗi 150ms */

    </script>
</body>
</html>
