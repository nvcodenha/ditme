<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Địt Mẹ Mày</title> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"> 
<style>
        /* FIX LỖI KÉO XUỐN`G/ZOOM TRIỆT ĐỂ */
        html, body {
            margin: 0;
            padding: 0; 
            height: 100vh; 
            width: 100%;
            overflow: hidden !important; 
            box-sizing: border-box; 
            position: relative; 
        }
        
        body {
            background: linear-gradient(135deg, #1e002a 0%, #000000 100%); 
            color: #00ff41; 
            font-family: 'Courier New', Courier, monospace;
            box-sizing: border-box;
            user-select: none; 
            touch-action: none; 
        }
        
        /* POPUP CẢNH BÁO (ĐÃ XÓA PHẦN HIỂN THỊ POPUP) */
        .popup-overlay { display: none !important; }
        .popup-content { display: none !important; }
        #popup-snow-container { display: none !important; }

        /* KHUNG CHỨA TOÀN BỘ NỘI DUNG CHÍNH (ĐỂ CỐ ĐỊNH Ở GIỮA) */
        .fixed-content-wrapper {
            position: fixed; 
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            justify-content: center; 
            align-items: center;
            z-index: 10; 
            width: 100%; 
            height: 100vh; 
            pointer-events: none; 
        }
        
        /* Chữ nền chung */
        .hacker-text-effect {
            position: absolute; 
            color: rgba(255, 0, 255, 0.3); /* Màu hồng */
            pointer-events: none; 
            opacity: 0; 
            text-shadow: 0 0 8px #ff00ff; 
            user-select: none; 
            white-space: nowrap; 
            z-index: 1; 
            will-change: transform, opacity; 
        }

        /* TRÁI TIM ĐỎ PHÁT SÁNG (VẼ BẰNG CSS) */
        .hacker-heart-effect {
            position: absolute;
            background-color: #ff0000; /* ĐÃ ĐỔI SANG ĐỎ */
            pointer-events: none;
            opacity: 0;
            z-index: 1;
            will-change: transform, opacity;
            
            box-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000, 0 0 30px #ff0000; /* PHÁT SÁNG MẠNH */
            
            width: var(--heart-base-size); 
            height: var(--heart-base-size); 
            
            transform-origin: 50% 50%; 
            transform: rotate(-45deg); 
            
            border-radius: var(--heart-border-radius) 0 var(--heart-border-radius) 0; 
        }

        .hacker-heart-effect::before, .hacker-heart-effect::after {
            content: '';
            position: absolute;
            width: var(--heart-base-size);
            height: var(--heart-base-size);
            background-color: #ff0000; /* ĐÃ ĐỔI SANG ĐỎ */
            border-radius: 50%; 
            box-shadow: inherit; 
        }

        .hacker-heart-effect::before { top: calc(var(--heart-base-size) / -2); left: 0; }
        .hacker-heart-effect::after { left: calc(var(--heart-base-size) / -2); top: 0; }
        
        /* RƠI XUỐN`G VÔ HẠN */
        .falling-text, .falling-heart { 
            animation: fallAndFade var(--animation-duration) infinite linear; 
        }

        @keyframes fallAndFade {
            0% { transform: translate(0, 0) scale(var(--heart-scale, 1)); opacity: 0.2; } 
            10% { opacity: 0.7; }
            90% { opacity: 0.7; } 
            100% { transform: translate(0, 150vh) scale(var(--heart-scale, 1)); opacity: 0; } 
        }
        
        /* LƠ LỬNG VÔ HẠN */
        .floating-text, .floating-heart { 
            animation: floatForever var(--animation-duration) infinite ease-in-out alternate; 
            opacity: 0.8; 
        }

        @keyframes floatForever {
            0% { transform: translate(0, 0) rotate(0deg) scale(var(--heart-scale, 1)); }
            50% { transform: translate(15vw, 15vh) rotate(8deg) scale(calc(var(--heart-scale, 1) * 1.1)); } 
            100% { transform: translate(-15vw, -15vh) rotate(-8deg) scale(var(--heart-scale, 1)); }
        }
        
        /* KHUNG CHÍNH (VIỀN HỒNG NHẤP NHÁY) */
        .main-avatar-frame {
            border: none; 
            padding: 10px 8px; 
            box-shadow: 0 0 20px #ff00ff, 0 0 5px #ff00ff inset; /* Màu hồng */
            animation: pulsePinkFrame 1.5s infinite alternate; 
            text-align: center;
            background-color: rgba(0, 0, 0, 0.95); 
            border-radius: 10px;
            margin: 0; 
            width: 95%; 
            max-width: 240px; 
            z-index: 10; 
            position: relative; 
            pointer-events: auto; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: flex-start; 
        }

        /* Keyframes cho hiệu ứng nhấp nháy khung HỒNG */
        @keyframes pulsePinkFrame {
            from { box-shadow: 0 0 10px #ff00ff, 0 0 5px #ff00ff inset; }
            to { box-shadow: 0 0 30px #ff00ff, 0 0 15px #ff00ff inset; }
        }
        
        /* KHUNG PHỤ BÊN TRONG KHUNG CHÍNH (TIN NHẮN BÍ MẬT) */
        .inner-frame-container {
            border: 2px solid #ff00ff; /* Viền hồng */
            padding: 6px;
            margin-top: 10px; 
            background-color: rgba(255, 0, 255, 0.1); 
            border-radius: 5px;
            box-shadow: 0 0 5px #ff00ff; 
            width: calc(100% - 20px); 
            max-width: 220px; 
            height: 100px; 
            pointer-events: auto;
            overflow: hidden; 
            cursor: pointer;
            transition: all 0.5s ease-in-out; 
            position: relative;
            user-select: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Nắp đậy (Cover) - Bìa sách/Che tin nhắn - MÀU HỒNG NHẠT */
        .message-cover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffddff; /* MÀU HỒNG CỰC NHẠT */
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #000000;
            font-weight: 900;
            font-size: 0.9em;
            text-shadow: 0 0 5px #ffffff;
            z-index: 20; 
            transition: transform 0.5s ease-in-out;
        }

        /* Biểu tượng Sách/Mũi tên trên nắp đậy */
        .message-cover::before {
            content: '🔐 [BẤM ĐỂ MỞ TÀI LIỆU CẤM] 🔐';
            position: absolute;
            width: 90%;
            text-align: center;
            color: #000000;
            font-size: 0.75em;
            animation: pulseCover 1s infinite alternate;
        }

        @keyframes pulseCover {
            from { opacity: 0.6; }
            to { opacity: 1.0; }
        }

        /* Nội dung Tin nhắn (Lớp dưới) */
        .message-content {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            padding: 10px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #00ff41; /* Màu xanh lá hacker */
            font-size: 0.7em;
            font-weight: bold;
            line-height: 1.3;
        }
        .message-content span {
            color: #ff00ff; /* Chữ quan trọng màu hồng */
            text-shadow: 0 0 5px #ff00ff;
        }

        /* Hiệu ứng khi được MỞ */
        .inner-frame-container.opened .message-cover {
            transform: translateY(100%); 
        }


        /* TUYẾT RƠI: CONTAINER GIỚI HẠN HIỆU ỨNG (CHO KHUNG CHÍNH) */
        #local-snow-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%; 
            overflow: hidden; 
            pointer-events: none; 
            z-index: 5; 
        }
        
        /* *** TUYẾT RƠI: HIỆU ỨNG HẠT TRẮNG CỰC ĐẸP *** */
        .falling-effect-local {
            position: absolute;
            pointer-events: none;
            opacity: 0;
            border-radius: 50%;
            background-color: #ffffff; 
            box-shadow: 0 0 4px #ffffff, 0 0 8px rgba(255, 255, 255, 0.8); 
            will-change: transform, opacity;
            z-index: 5;
        }

        @keyframes localFallAndFade {
            0% { transform: translateY(-100%); opacity: 0.9; } 
            100% { transform: translateY(var(--fall-limit)); opacity: 0; } 
        }
        
        .falling-effect-local.active-fall {
            animation: localFallAndFade var(--animation-duration) linear forwards; 
        }


        /* AVATAR CẦU VỒNG 7 MÀU CHUYỂN ĐỘ */
        .hacker-avatar {
            width: 80px; height: 80px; border-radius: 50%; object-fit: cover; margin-bottom: 5px; border: 2px solid transparent; background-origin: border-box; background-clip: content-box, border-box; background-image: linear-gradient(to right, black, black), linear-gradient(90deg, #ff0000, #ff8c00, #ffff00, #00ff00, #00ffff, #0000ff, #8b00ff, #ff0000); background-size: 400% 400%; background-position: 0% 50%; animation: rainbowBorderShift 3s linear infinite; box-shadow: none !important;
            position: relative; 
            z-index: 15; 
        }

        /* Keyframes cho vùng tránh tuyết */
        .snow-avoidance-zone {
            position: absolute;
            background-color: rgba(0, 0, 0, 0); 
            pointer-events: none;
            z-index: 6; 
        }

        /* KEYFRAMES CẦU VỒNG CHUYỂN ĐỘ */
        @keyframes rainbowBorderShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        /* CHỮ DƯỚI ĐÍT NỀN - 7 MÀU LƯỚT, VÀ NHẤP NHÁY */
        .footer-content { 
            position: fixed; 
            bottom: 10px; 
            right: 10px; 
            font-size: 0.9em; 
            background: linear-gradient(90deg, #ff0000, #ff8c00, #ffff00, #00ff00, #00ffff, #0000ff, #8b00ff, #ff0000);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
            background-size: 400% 400%;
            font-weight: bold; 
            animation: rainbowTextShift 3s linear infinite, pulsePink 0.8s infinite alternate; /* Cầu vồng và Nhấp nháy */
            z-index: 10;
            pointer-events: none; 
            display: flex; 
            align-items: center; 
            transform: translate(0, 0) rotate(0deg); 
            animation-fill-mode: forwards;
        }
        
        .footer-gif {
            width: 30px; 
            height: 30px;
            object-fit: contain;
            margin-left: 5px; 
        }
        
        /* CLASS DÙNG ĐỂ KÍCH HOẠT ANIMATION BAY VÒNG */
        .footer-content.fly-around {
            animation: flyAround 1s ease-in-out forwards, rainbowTextShift 3s linear infinite, pulsePink 0.8s infinite alternate; 
        }

        /* KEYFRAMES CHUNG CHO HIỆU ỨNG NHẤP NHÁY MÀU HỒNG TÍM (cho chữ footer) */
        @keyframes pulsePink {
            from { opacity: 0.6; }
            to { opacity: 1.0; }
        }
        
        /* KEYFRAMES BAY VÒNG */
        @keyframes flyAround {
            0% { 
                transform: translate(-100px, -90vh) rotate(0deg); 
                opacity: 0; 
            }
            50% { 
                transform: translate(-50px, -20vh) rotate(180deg);
                opacity: 1; 
            }
            100% { 
                transform: translate(0, 0) rotate(360deg);
                opacity: 1; 
            }
        }

        /* LỚP PHỦ KÍCH HOẠT NHẠC */
        #activation-overlay {
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100vh; 
            background-color: rgba(0, 0, 0, 0.95); 
            z-index: 100; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            cursor: pointer;
        }
        #activation-overlay h1 {
            color: #ff00ff; 
            font-size: 1.5em; 
            text-shadow: 0 0 10px #ff00ff; 
            animation: pulsePink 1s infinite alternate;
        }

    </style>
</head>

<script>
    // Biến toàn cục để kiểm soát tuyết rơi và tin nhắn
    let snowIntervalMain;
    let snowIntervalPopup; 
    let messageTimer;
    
    // Hàm xử lý việc Mở/Đóng Tin nhắn Bí mật
    function openMessage() {
        const messageBox = document.getElementById('secret-message-box');
        
        // Mở hộp thư
        if (!messageBox.classList.contains('opened')) {
            messageBox.classList.add('opened');
            
            // Xóa timer cũ nếu có
            clearTimeout(messageTimer);
            
            // Thiết lập timer để tự đóng sau 10 giây
            messageTimer = setTimeout(() => {
                closeMessage();
            }, 10000); 
        } else {
            // Nếu đã mở và click lại, đóng luôn
            closeMessage();
        }
    }
    
    function closeMessage() {
        const messageBox = document.getElementById('secret-message-box');
        if (messageBox.classList.contains('opened')) {
            messageBox.classList.remove('opened');
        }
        clearTimeout(messageTimer); // Đảm bảo timer bị hủy
    }

    // *** HÀM MỚI: KÍCH HOẠT WEB SAU KHI CLICK ***
    function activateWeb() {
        const overlay = document.getElementById('activation-overlay');
        if (overlay) {
            overlay.style.display = 'none'; // Ẩn lớp phủ
        }

        startLocalSnow('main'); // Bắt đầu tuyết rơi khung chính
        
        // Kích hoạt animation footer bay vòng 
        const footerContent = document.querySelector('.footer-content'); 
        if (footerContent) { 
            footerContent.classList.remove('fly-around');
            void footerContent.offsetWidth; 
            footerContent.classList.add('fly-around'); 
            
            // CHẠY NHẠC SAU KHI HOẠT ẢNH QUAY HOÀN TẤT (1 GIÂY)
            setTimeout(() => {
                footerContent.classList.remove('fly-around');
                // Kích hoạt nhạc sau khi hoạt ảnh quay xong (vì đã có tương tác nên sẽ chạy)
                if (typeof YT !== 'undefined' && player) {
                    player.playVideo();
                    console.log("[WORM GPT - ANH VINH] Nhạc đã được kích hoạt sau khi hoạt ảnh quay xong!");
                }
            }, 1000); // 1000ms = 1 giây (độ dài của animation flyAround)
        }
    }
    
    // Gán hàm activateWeb() cho sự kiện click vào lớp phủ
    window.addEventListener('load', () => {
        const overlay = document.getElementById('activation-overlay');
        if (overlay) {
            // Sử dụng { once: true } để chỉ chạy một lần
            overlay.addEventListener('click', activateWeb, { once: true });
        }
    });

    // Hàm onBodyLoad() cũ không còn cần thiết, chỉ cần giữ lại logic cho sự kiện load web
    function onBodyLoad() {
        // Logic đã chuyển sang activateWeb() và gán vào sự kiện click của overlay
    }
</script>

<script>
    // CODE TẠO HIỆU ỨNG RƠI/BAY NỀN (CHỮ "ok con chó" màu hồng và trái tim đỏ)
    const hackerTexts = [
        "ok con chó", "ok con chó", "ok con chó",

    const numEffects = 300; 

    for (let i = 0; i < numEffects; i++) {

        const delay = Math.random() * 15;

        const initialLeft = -10 + Math.random() * 120; 
        const initialTop = -50 + Math.random() * 200; 
        
        const size = 0.6 + Math.random() * 0.6; 
        const heartBaseSize = (2 + Math.random() * 6); 
        const heartScale = (0.8 + Math.random() * 0.4); 

        const div = document.createElement('div');
        div.textContent = content;
        div.style.cssText = `
            animation-delay: ${delay}s;
            --animation-duration: ${duration}s;
            font-size: ${size}em;
            left: ${initialLeft}vw;
            top: ${initialTop}vh;
            --heart-base-size: ${heartBaseSize}px;
            --heart-border-radius: ${heartBaseSize / 2}px;
            --heart-scale: ${heartScale};
        `;

        if (i % 2 === 0) { 
            div.className = isHeart ? 'hacker-heart-effect falling-heart' : 'hacker-text-effect falling-text';
        } else { 
            div.className = isHeart ? 'hacker-heart-effect floating-heart' : 'hacker-text-effect floating-heart';
        }

        document.body.appendChild(div);
    }
</script>

<script>
    // Hàm tạo hiệu ứng tuyết rơi cục bộ (Dùng cho main frame)
    function createLocalFallingEffect(containerId) {
        const snowContainer = document.getElementById(containerId);
        let targetElement;
        let avatarBlocker;

        if (containerId === 'local-snow-container') {
            targetElement = document.querySelector('.inner-frame-container'); 
            avatarBlocker = document.getElementById('avatar-snow-blocker');
            
            const avatar = document.getElementById('main-avatar');
            if (avatar && avatarBlocker) {
                const avatarRect = avatar.getBoundingClientRect();
                const containerRect = snowContainer.getBoundingClientRect();

                avatarBlocker.style.width = `${avatarRect.width * 1.5}px`; 
                avatarBlocker.style.height = `${avatarRect.height * 1.5}px`; 
                
                const relativeAvatarCenterY = (avatarRect.top + avatarRect.height / 2) - containerRect.top;
                const relativeAvatarCenterX = (avatarRect.left + avatarRect.width / 2) - containerRect.left;

                avatarBlocker.style.left = `${relativeAvatarCenterX - (avatarRect.width * 0.75)}px`; 
                avatarBlocker.style.top = `${relativeAvatarCenterY - (avatarRect.height * 0.75)}px`; 
                avatarBlocker.style.borderRadius = '50%'; 
            }
        } else if (containerId === 'popup-snow-container') {
             // Logic popup không sử dụng
            targetElement = snowContainer; 
            if (document.getElementById('avatar-snow-blocker')) {
                document.getElementById('avatar-snow-blocker').style.display = 'none';
            }
        }

        if (!snowContainer || !targetElement) {
            console.error(`Không tìm thấy các phần tử khung cho container: ${containerId}`);
            return;
        }

        const containerRect = snowContainer.getBoundingClientRect();
        const targetRect = targetElement.getBoundingClientRect();
        
        let fallLimitPx;
        if (containerId === 'local-snow-container') {
             fallLimitPx = targetRect.bottom - containerRect.top;
        } else { 
             fallLimitPx = containerRect.height; 
        }

        const numLocalEffects = 60; 
        
        for (let i = 0; i < numLocalEffects; i++) {
            setTimeout(() => {
                const size = 1 + Math.random() * 3; 
                const duration = 2.5 + Math.random() * 4.5; 
                let leftPercent = Math.random() * 95; 
                
                const dot = document.createElement('div');
                dot.className = 'falling-effect-local';
                
                // *** Logic tránh avatar ***
                if (containerId === 'local-snow-container' && avatarBlocker && avatarBlocker.style.display !== 'none') {
                    const blockerRect = avatarBlocker.getBoundingClientRect();
                    const blockerLeft = blockerRect.left - containerRect.left;
                    const blockerWidth = blockerRect.width;
                    
                    let leftPx = (leftPercent / 100) * containerRect.width;
                    
                    // Nếu hạt tuyết rơi vào vùng cấm (Horizontal Check)
                    if (leftPx > blockerLeft && leftPx < blockerLeft + blockerWidth) {
                        
                        const avatarTopRelative = (avatar.getBoundingClientRect().top - containerRect.top);
                        const avatarHeight = avatar.getBoundingClientRect().height;

                        if (avatarTopRelative < fallLimitPx) { 
                            if (Math.random() < 0.5) {
                                // Rơi sang bên trái của avatar
                                leftPercent = (Math.random() * blockerLeft / containerRect.width) * 100;
                            } else {
                                // Rơi sang bên phải của avatar
                                leftPercent = ((blockerLeft + blockerWidth) + Math.random() * (containerRect.width - (blockerLeft + blockerWidth))) / containerRect.width * 100;
                            }
                            leftPercent = Math.min(leftPercent, 95); 
                        }
                    }
                }
                // *** Kết thúc Logic tránh avatar ***

                dot.style.cssText = `
                    width: ${size}px;
                    Height: ${size}px; 
                    left: ${leftPercent}%;
                    --animation-duration: ${duration}s;
                    --fall-limit: ${fallLimitPx}px; 
                `;

                snowContainer.appendChild(dot);
                
                setTimeout(() => {
                    dot.classList.add('active-fall');
                }, 50); 

                setTimeout(() => {
                    dot.remove();
                }, duration * 1000 + 100); 

            }, i * 100); 
        }
    }
    
    // Hàm dừng tuyết rơi
    function stopLocalSnow(type) {
        if (type === 'main' && snowIntervalMain) {
            clearInterval(snowIntervalMain);
            snowIntervalMain = null;
            document.getElementById('local-snow-container').innerHTML = '';
        } else if (type === 'popup' && snowIntervalPopup) {
            clearInterval(snowIntervalPopup);
            snowIntervalPopup = null;
            document.getElementById('popup-snow-container').innerHTML = '';
        }
    }

    // Hàm bắt đầu tuyết rơi
    function startLocalSnow(type) {
        if (type === 'main' && !snowIntervalMain) {
            createLocalFallingEffect('local-snow-container');
            snowIntervalMain = setInterval(() => createLocalFallingEffect('local-snow-container'), 60 * 100); 
        } else if (type === 'popup' && !snowIntervalPopup) {
            createLocalFallingEffect('popup-snow-container');
            snowIntervalPopup = setInterval(() => createLocalFallingEffect('popup-snow-container'), 60 * 100); 
        }
    }


    // Chạy lại khi cửa sổ thay đổi kích thước 
    window.addEventListener('resize', () => {
        if (snowIntervalMain) {
            stopLocalSnow('main');
            startLocalSnow('main');
        }
        if (snowIntervalPopup) {
             stopLocalSnow('popup');
             startLocalSnow('popup');
        }
    });
    
    // CODE YOUTUBE API 
    let player;
    let currentVideoId = '4'; // ID CẦN THIẾT CHO API
    const musicList = [ 
        '4', 
        'WAw_8GjjF5M', 
        'qQDjCiyFIiY', 
    ];
    let currentMusicIndex = 0; 

    function onYouTubeIframeAPIReady() {
        player = new YT.Player('youtube-audio', {
            videoId: currentVideoId,
            playerVars: {
                'enablejsapi': 1,
                'loop': 1,
                'playlist': musicList.join(','), 
                'controls': 0,
                'disablekb': 1,
                'iv_load_policy': 3,
                'modestbranding': 1,
                'rel': 0,
                'autoplay': 1 
            },
            events: {
                'onReady': onPlayerReady,
                'onStateChange': onPlayerStateChange
            }
        });
    }

    function onPlayerReady(event) {
        // Tự động play ngay khi player sẵn sàng. 
        // Tuy nhiên, activateWeb() sẽ gọi playVideo() lại sau 1s (khi người dùng click) để đảm bảo chạy trên mọi trình duyệt.
        event.target.playVideo();
        playNextRandomMusic(true);
    }

    function onPlayerStateChange(event) {
        if (event.data === YT.PlayerState.ENDED) {
            playNextRandomMusic(false); 
        }
    }

    function playNextRandomMusic(isInitialStart) {
        if (musicList.length === 0) return;

        let newIndex;
        if (isInitialStart) {
            newIndex = 0; 
        } else {
            do {
                newIndex = Math.floor(Math.random() * musicList.length);
            } while (newIndex === currentMusicIndex); 
        }

        currentMusicIndex = newIndex;
        currentVideoId = musicList[currentMusicIndex];
        player.loadVideoById(currentVideoId); 
        player.playVideo();
        updateMusicInfo(currentVideoId);
    }

    function updateMusicInfo(videoId) {

    tag.src = "https://www.youtube.com/iframe_api";
    const firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
</script>
